version: '3.3'

services:
  jaspr_single:
    container_name: jaspr_single
    build:
      context: .
      dockerfile: build/docker/dockerfile-single
    # .env is optional for single-container deploys.
    # If variables are not provided, localhost-friendly defaults are used.
    # Cloud environments can still override these via .env or shell env vars.
    environment:
      - FLASK_APP=jaspr
      - FLASK_DEBUG=True
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
      # single-container redis lives inside the same container
      - REDIS_HOST=127.0.0.1
      # nginx setup.sh uses these
      - SSL_CERTIFICATE=${SSL_CERTIFICATE:-localhost}
      - DEPLOYMENT_DNS="${DEPLOYMENT_DNS:-localhost}"
    image: cdcflu/jaspr:single
    tty: true
    volumes:
      # Defaults to mounting the current repo when CODESHARE is unset.
      - "${CODESHARE:-.}:/app"
      # Credential/cert mounts default to local run/ paths for localhost use.
      - "${CREDENTIALS_PATH:-./run/nginx/credentials}:/credentials"
      - "${LETSENCRYPT_CONFIG_PATH:-./run/nginx/letsencrypt/config}:/etc/letsencrypt"
      - "${LETSENCRYPT_DATA_PATH:-./run/nginx/letsencrypt/data}:/data/letsencrypt"
    ports:
      - "${JASPR_HTTP_PORT:-80}:80"
      - "${JASPR_HTTPS_PORT:-443}:443"
