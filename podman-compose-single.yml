# JASPR single-container compose file.
#
# Designed to behave identically under Docker Compose, Podman Compose, and
# (with `singularity run`) Singularity / Apptainer.  See DEPLOY_QUICKSTART.md
# for engine-specific run commands.
#
# Notes:
#   * The container runs as UID/GID 1000 (the "jaspr" user baked into the
#     image).  No root, no privilege escalation.
#   * Listens on 8080 inside the container - a non-privileged port that
#     rootless Podman and unprivileged Singularity can bind without
#     CAP_NET_BIND_SERVICE.
#   * The image filesystem is treated as read-only at runtime; only /tmp is
#     writable.  Mount additional volumes only if you need to persist
#     session/upload data across restarts.
#   * No nginx, no embedded redis, no supervisor.  TLS is expected to be
#     terminated upstream (host nginx, ingress, etc.) when needed.

version: "3.8"

services:
  jaspr:
    container_name: jaspr
    image: cdcgov/jaspr:single
    build:
      context: .
      dockerfile: build/docker/dockerfile-single
    # Drop all Linux capabilities; the app needs none of them.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # tmpfs gives a writable /tmp without persisting it on the host.
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
    user: "1000:1000"
    environment:
      - PYTHONUNBUFFERED=1
      # Disabled Redis due to JSON serialization issues with pandas Timestamps
      # in HINT/ICP parser data. Filesystem sessions work well enough for now.
      # - REDIS_HOST=redis
    ports:
      # host:container.  Override JASPR_HTTP_PORT to publish on a different
      # host port (the container always listens on 8080 internally).
      - "${JASPR_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    container_name: jaspr-redis
    image: redis:7-alpine
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:rw,size=128m,mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
