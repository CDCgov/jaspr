version: '3.3'

services:
  jaspr:
      build:
        context: .
        dockerfile: Dockerfile_JASPR
      image: cdcflu/jaspr:v1
      environment:
        - FLASK_APP=jaspr
        - FLASK_DEBUG=True
        - FLASK_ENV=development
        - REDIS_HOST=redis
      volumes:
        - ${CODESHARE}:/app
      working_dir: /app
      tty: true
      links:
        - redis
      depends_on:
        - redis
  
  nginx:
      image: webapp-nginx
      build:
        context: .
        dockerfile: Dockerfile-nginx
      ports:
        - 1080:80
      depends_on:
        - jaspr

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

