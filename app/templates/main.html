{% extends "main_layout.html" %}
{% set txtTitle="Welcome to JASPR!" %}
<div id="#body" >
	{% block body %}
	<div class="row">
		<div class="col-3"></div>
		<div class="col-9">
			<div class="nav nav-tabs" role="tablist">
					<a class="nav-item nav-link active" data-toggle="tab" href="#graph" aria-controls="graph">Graph</a>
					<a class="nav-item nav-link" data-toggle="tab" href="#table" aria-controls="table">Table</a>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-3">
			<ul class="nav nav-pills nav-stacked">
				<li class="nav-item">
					<a class="nav-link active" data-toggle="pill" href="#" >Sample #1</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" data-toggle="pill" href="#" >Sample #2</a>
				</li>
				<li class="nav-item">
					<a class="nav-link " data-toggle="pill" href="#" >Sample #3</a>
				</li>
				<li class="nav-item">
					<a class="nav-link " data-toggle="pill" href="#" >Sample #4</a>
				</li>
			</ul>
		</div>
		<div class="col-9">

			<div class="tab-content">
				<div class="tab-pane fade show active" role="tabpanel" active id="graph">
					<span class="dataGraph" role="tabpanel"> {{graph_div | safe }}</span>
				</div>
				<div class="tab-pane fade" id="table">
					<span class="dataTable"> {{table_div | safe }}</span>
				</div>
			</div>
		</div>
	</div>
	{%endblock%}
</div> <!-- Body -->
