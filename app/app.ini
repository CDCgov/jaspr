;  app.ini
;

[uwsgi]
protocol = uwsgi

; this is the name of our python file minus the extension
module = run

; This is the name of the variable
; in our script that will be called
callable = app
master = true
; Set uWSGI to start up 5 workers
processes = 5
; We use the port 5000 which we will
; then expose on our Dockerfile
buffer-size=32768000
socket = 0.0.0.0:5000
vacuum = true
die-on-term = true

; disabling wsgi.file_wrapper for excel download from memory
wsgi-disable-file-wrapper = true
