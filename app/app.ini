; app.ini

[uwsgi]
; protocol and app entry
protocol = uwsgi
module = run
callable = app

; process management
master = true
processes = 5
vacuum = true
die-on-term = true

; networking / socket
buffer-size = 32768000
socket = 0.0.0.0:5000

; disabling wsgi.file_wrapper for excel download from memory
wsgi-disable-file-wrapper = true

; logging & visibility (your new settings)
; log everything to stdout
logto = /dev/stdout
log-encoder = nl
disable-logging = false

; request / error visibility
log-4xx = true
log-5xx = true
log-slow = true
log-slow-ms = 200

; show exceptions
catch-exceptions = true