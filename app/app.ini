; app.ini - portable, non-root JASPR uwsgi configuration
;
; This config is consumed by the dockerfile-single image and is also
; suitable for "uwsgi --ini /app/app.ini" under Singularity.

[uwsgi]
; --- Application entry point ---
; The "jaspr" package is installed at build time (pip install /app), so
; this works regardless of the current working directory and does not
; require run.py on disk.
module          = jaspr:app
need-app        = true

; --- Networking ---
; HTTP listener on a non-privileged port.  No nginx in front, so uwsgi
; speaks HTTP directly.  TLS, when needed, is terminated upstream.
http-socket     = 0.0.0.0:8080
buffer-size     = 32768000

; --- Process management ---
master          = true
processes       = 4
threads         = 2
enable-threads  = true
single-interpreter = true
vacuum          = true
die-on-term     = true

; --- File / response handling ---
; Required so in-memory Excel downloads stream correctly.
wsgi-disable-file-wrapper = true

; --- Logging ---
; Log to stdout/stderr (no /var/log writes; nothing requires write access
; outside /tmp at runtime).
log-master      = true
log-encoder     = nl
disable-logging = false
log-4xx         = true
log-5xx         = true
log-slow        = true
log-slow-ms     = 200

; --- Diagnostics ---
catch-exceptions = true
