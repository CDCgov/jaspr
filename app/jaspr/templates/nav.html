<a href="#main-content" class="skip-link" style="position: absolute; left: -9999px; z-index: 999;">Skip to main content</a>

<div class="row w-100">
  <nav class="menubar navbar navbar-expand-lg navbar-dark bg-dark w-100" aria-label="Primary navigation">
    <a class="navbar-brand" href="/" aria-label="JASPR Curve Fitting Tool home">JASPR Curve Fitting Tool</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="/"{% if request.path == '/' %} aria-current="page"{% endif %}>Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/upload"{% if '/upload' in request.path %} aria-current="page"{% endif %}>Load Data</a>
        </li>
        {% if session.get('analysis_ready') %}
        <li class="nav-item">
          <a class="nav-link" href="/analysis"{% if '/analysis' in request.path %} aria-current="page"{% endif %}>Analysis</a>
        </li>
        {% endif %}
        {% if session.get('report_ready') %}
        <li class="nav-item">
          <a class="nav-link" href="/report"{% if '/report' in request.path %} aria-current="page"{% endif %}>Report</a>
        </li>
        {% endif %}
        <li class="nav-item">
          <a class="nav-link" href="/settings"{% if '/settings' in request.path %} aria-current="page"{% endif %}>Settings</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/reset">Reset Session</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/license"{% if '/license' in request.path %} aria-current="page"{% endif %}>License</a>
        </li>

      </ul>
    </div>
  </nav>
</div>

<style>
.skip-link:focus {
  position: static;
  display: inline-block;
  background: #005eaa;
  color: white;
  padding: 8px 16px;
  text-decoration: none;
  border-radius: 4px;
  outline: 3px solid #88c3ea;
  outline-offset: 2px;
}
</style>
