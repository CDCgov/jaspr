{% extends "main_layout.html" %}
{% block body %}
<div class="row">
	<div class="col-2">
		<div>Selected Experiment</div>
		<select>
			{% for experiment in experimentList %}
			<option value="{{experiment}}">{{experiment}}</option>
			{% endfor %}
		</select>
	</div>
	<div class="col-10">
		<ul class="nav nav-tabs">
			<li class="nav-item">
				<a class="nav-link active" data-toggle="tab" href="#graph">Graph</a>
			</li>
			<li class="nav-item">
				<a class="nav-link" data-toggle="tab" href="#table">Table</a>
			</li>
		</ul>
	</div>
</div>
<div class="row content-row">
	<div class="col-2 selector ">
		<ul class="nav flex-column nav-pills" role="tablist">
			{% for sample in sampleList %}
			<li class="nav-item"><a class="nav-link
							{% if sample == selectedSample %}
							active
							{% endif %}
							" data-toggle=" pill" href="{{ sample }}">{{ sample }}</a>
			</li>
			{% endfor %}
		</ul>
	</div>
	<div class="col-10">
		<div class="tab-content">
			<div class="tab-pane fade show active" active id="graph">
				<span class="dataGraph"> {{graph_div | safe }}</span>
			</div>
			<div class="tab-pane fade" id="table">
				<span class="dataTable"> {{table_div | safe }}</span>
			</div>
		</div>
	</div>
</div>
{%endblock%}
