{% extends "jaspr_layout.html" %}

{% block body %}
<script src={{ url_for('static', filename='js/jaspr-main.js') }}></script>
<div class="row">
	<div class="col-3">
		<div class="form-group">
			<label for="selExp">Selected Experiment</label>
			<select class="form-control" id="selExp"
							onchange='ChangeExperiment(this);'>
				{% for experiment in experimentList %}
				<option value="{{experiment}}">{{experiment}}</option>
				{% endfor %}
			</select>
		</div>
	</div>
	<div class="col-9">
		<ul class="nav nav-tabs">
			<li class="nav-item">
				<a class="nav-link active" data-toggle="tab" href="#jasprgraph">Graph</a>
			</li>
			<li class="nav-item">
				<a class="nav-link" data-toggle="tab" href="#jasprtable">Table</a>
			</li>
		</ul>
	</div>
</div>
<div class="row content-row">
	<div class="col-3 selector ">
		<ul class="samplelist nav flex-column nav-pills">
			{% for sample in sampleList %}
			<li class="nav-item">
				<a class="nav-link {% if sample == selectedSample %}active{% endif %}"
				   data-toggle="pill" onclick="ChangeSample('{{sample}}');" href="#">{{ sample }}</a>
			</li>
			{% endfor %}
		</ul>
	</div>
	<div class="col-9">
		<div class="tab-content">
			<div class="tab-pane fade show active" active id="jasprgraph">
				<span class="dataGraph">loading Graph</span>
			</div>
			<div class="tab-pane show" id="jasprtable">
				<span class="dataTable">loading table</span>
			</div>
		</div>
	</div>
</div>
{%endblock%}
{%block pagescript%}
<!--No page level javascript required -->
{%endblock%}
