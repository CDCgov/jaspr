{% extends "jaspr_layout.html" %}
{% set txtTitle="Welcome to JASPR!" %}
{% block body %}
<script src={{ url_for('static', filename='js/jaspr-upload.js') }}></script>

<div class="row">
  <div class="col-3"></div>
  <div class="col-6"><h1>File Selection</h1></div>
</div>

<form action="/upload" method="POST" enctype="multipart/form-data">

  <div class="row">
    <div class="col-3"></div>
    <div class="col-6">
      <div class="dropdown">
       <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
         {{ curr_parser or ' -- Select a parser -- ' }}
       </button>
       <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
         {% for parser in parser_list %}
           <a class="dropdown-item" href="#">{{ parser }}</a>
         {% endfor %}
       </div>
      </div>
    </div>
  </div>

  <br />

  <div class="row">
    <div class="col-1"></div>
    <div class="col-2 align-right">Data file</div>
    <div class="col-6">
      <div class="input-group">
        <label class="input-group-btn">
          <span class="btn btn-primary">
            Browse&hellip; <input name ='datafile' type="file" multiple>
          </span>
        </label>
        <input type="text" class="form-control" readonly>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-1"></div>
    <div class="col-2 align-right">Key file</div>
    <div class="col-6">
      <div class="input-group">
        <label class="input-group-btn">
          <span class="btn btn-primary">
            Browse&hellip; <input name ='keyfile' type="file" multiple>
          </span>
        </label>
        <input type="text" class="form-control" readonly>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-3"></div>
    <div class="col-6">
      <input class="btn" type="submit" />
    </div>
  </div>

  <div class="row mt-2">
    <div class="col-3"></div>
    <div class="col-6">
      <span class="btn btn-outline-secondary invisible">Load Example Anscombe Dataset</span>
    </div>
  </div>

  <div class="row mt-2">
    <div class="col-3"></div>
    <div class="col-6">
      <a class="btn btn-outline-secondary" href="/loadAnscombeData">Load Example<br>Anscombe Dataset</a>
    </div>
  </div>

</form>

<br />
<br />

{%endblock%}
