{% extends "jaspr_layout.html" %}
{% set txtTitle="Welcome to JASPR!" %}
{% block body %}
<script src={{ url_for('static', filename='js/jaspr-upload.js') }}></script>

<div class="row">
  <div class="col-3"></div>
  <div class="col-6"><h1>File Selection</h1></div>
</div>

<form action="/upload" method="POST" enctype="multipart/form-data">

  <div class="row">
    <div class="col-3"></div>
    <div class="col-6">
      <label for="parser" style="display: block; margin-bottom: 8px; font-weight: bold;">
        Parser
        <span aria-hidden="true">*</span>
        <span class="sr-only">required</span>
      </label>
      <select id="parser" name="parser" class="form-control" required style="display: block;">
        <option value="">-- Select a parser --</option>
        {% for parser in parser_list %}
          <option value="{{ parser }}"{% if curr_parser == parser %} selected{% endif %}>{{ parser }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <br />

  <div class="row">
    <div class="col-1"></div>
    <div class="col-2 align-right">
      <label for="datafile">
        Data file
        <span aria-hidden="true">*</span>
        <span class="sr-only">required</span>
      </label>
    </div>
    <div class="col-6">
      <div class="input-group">
        <label for="datafile" class="input-group-btn">
          <span class="btn btn-primary">
            Browse&hellip;
          </span>
          <input id="datafile" 
                 name="datafile" 
                 type="file" 
                 multiple
                 required
                 aria-describedby="datafile-help">
        </label>
        <input id="datafile-name" 
               type="text" 
               class="form-control" 
               readonly
               aria-label="Selected data file"
               aria-live="polite">
      </div>
      <small id="datafile-help" style="display: block; margin-top: 4px; color: #555555;">
      </small>
    </div>
  </div>

  <div class="row">
    <div class="col-1"></div>
    <div class="col-2 align-right">
      <label for="keyfile">
        Key file
        <span aria-hidden="true">*</span>
        <span class="sr-only">required</span>
      </label>
    </div>
    <div class="col-6">
      <div class="input-group">
        <label for="keyfile" class="input-group-btn">
          <span class="btn btn-primary">
            Browse&hellip;
          </span>
          <input id="keyfile" 
                 name="keyfile" 
                 type="file" 
                 multiple
                 required
                 aria-describedby="keyfile-help">
        </label>
        <input id="keyfile-name" 
               type="text" 
               class="form-control" 
               readonly
               aria-label="Selected key file"
               aria-live="polite">
      </div>
      <small id="keyfile-help" style="display: block; margin-top: 4px; color: #555555;">
      </small>
    </div>
  </div>

  <div class="row">
    <div class="col-3"></div>
    <div class="col-6">
      <button class="btn btn-primary" type="submit">Submit files</button>
    </div>
  </div>

  <div class="row mt-2">
    <div class="col-3"></div>
    <div class="col-6">
      <a class="btn btn-outline-secondary" href="/loadAnscombeData">Load Example<br>Anscombe Dataset</a>
    </div>
  </div>

</form>

<br />
<br />

<style>
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}
</style>

{%endblock%}
