{% extends "jaspr_layout.html" %}
{% set txtTitle="Welcome to JASPR!" %}
{% block body %}
<script src={{ url_for('static', filename='js/jaspr-settings.js') }}></script>
<div class="row">
	<div class="col-3">
	</div>
	<div class="col-9">
		<h1>Settings</h1>

		<form action=''>
			<fieldset>
				<legend>Curve Display</legend>
				<div class="form-check">
					<input type="checkbox" class="form-check-input" id="showCurve" {% if show_fit %}Checked{% endif %}>
					<label class="form-check-label" for="showCurve">Show Curve Fit</label>
				</div>

				<br />

				<div class="form-check">
					<input type="checkbox" class="form-check-input" id="blankCorrection" {% if blank_correction %}Checked{% endif %}>
					<label class="form-check-label" for="blankCorrection">Blank Correction</label>
				</div>
			</fieldset>

            <br /><br />

			<fieldset>
				<legend>Axis Scale</legend>
				<div class="form-check">
					<input type="radio" class="form-check-input" name="axisScale" value="log" id="log" {% if x_axis_type == 'log' %}Checked{%endif%}>
					<label class="form-check-label" for="log">Log Scale</label>
				</div>
				<div class="form-check">
					<input type="radio" class="form-check-input" name="axisScale" value="linear" id="linear" {% if x_axis_type=='linear' %}Checked{%endif%}>
					<label class="form-check-label" for="linear">Linear Scale</label>
				</div>
			</fieldset>
            
            <br /><br />

			<fieldset>
				<legend>Fitting Function</legend>
				<label for="function-select">Select function:</label>
				<select id="function-select" class="form-control" style="width: auto;">
					<option value="">{{ curr_function }}</option>
					{% for fn in function_list %}
                        <option value="{{fn}}">{{fn}}</option>
                    {%endfor%}
				</select>
			</fieldset>

			<br />

			<button type="button" class="btn btn-primary" onClick="GetPing();">Check Connection (Ping)</button>
			<div id="pingResult" role="status" aria-live="polite" aria-label="Ping result">
				<span id="pingValue"></span>
			</div>
		</form>
		<div>
			<a href="/analysis" class="btn btn-primary">Execute Analysis</a>
		</div>
	</div>
</div>

<style>
fieldset {
  border: 1px solid #ccc;
  padding: 16px;
  margin-bottom: 16px;
  border-radius: 4px;
}

legend {
  padding: 0 8px;
  font-weight: bold;
  color: #005eaa;
}

.form-check {
  margin-bottom: 12px;
}

.form-check-input {
  margin-right: 8px;
}
</style>

{%endblock%}
