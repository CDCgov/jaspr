{% extends "jaspr_layout.html" %}
{% set txtTitle="Welcome to JASPR!" %}
{% block body %}
<script src={{ url_for('static', filename='js/jaspr-settings.js') }}></script>
<div class="row">
	<div class="col-3">
	</div>
	<div class="col-9">
		<form action=''>
			<input type="checkbox" id="showCurve" {% if show_fit %}Checked{% endif %}>Show Curve Fit</input>

            <br /><br />

			<input type="checkbox" id="blankCorrection" {% if blank_correction %}Checked{% endif %}>Blank Correction</input>

            <br /><br />

			<div id="axisScaleSelect" class="btn-group btn-group-toggle" data-toggle="buttons">
				<label class="btn btn-secondary {% if x_axis_type == 'log' %}active{% endif %}">
					<input type="radio" name="axisScale" id="log" autocomplete="off" {% if x_axis_type == 'log' %}Checked{%endif%}>
                        Log Scale
					</input>
				</label>
				<label class="btn btn-secondary {% if x_axis_type == 'linear' %}active{% endif %}">
					<input type="radio" name="axisScale" id="linear" autocomplete="off" {% if x_axis_type=='linear' %}Checked{%endif%}>
                        Linear Scale
					</input>
				</label>
			</div>
            
            <br /><br />

			<div class="dropdown">
				<button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
					{{ curr_function }}
				</button>
				<div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
					{% for fn in function_list %}
                        <a class="dropdown-item" href="#">{{fn}}</a>
                    {%endfor%}
				</div>
			</div>
			<br>
			<button type="button" class="btn" onClick="GetPing();">ping</button><br>
			<span id="pingTitle" style="display: None">ping value:</span>&nbsp;
			<span id="pingValue"></span>
		</form>
		<div>
			<a href="\" class="btn btn-primary">Return</a>
		</div>
	</div>
</div>
{%endblock%}
</body>
