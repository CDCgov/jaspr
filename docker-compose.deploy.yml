version: '3.8'

services:
  jaspr:
    container_name: jaspr
    image: ${JASPR_IMAGE:-cdcflu/jaspr:single}
    restart: unless-stopped
    environment:
      - FLASK_APP=jaspr
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=127.0.0.1
      - SSL_CERTIFICATE=${SSL_CERTIFICATE:-localhost}
      - DEPLOYMENT_DNS=${DEPLOYMENT_DNS:-localhost}
    ports:
      - "${JASPR_HTTP_PORT:-80}:80"
      - "${JASPR_HTTPS_PORT:-443}:443"
