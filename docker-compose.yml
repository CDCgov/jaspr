version: '3.3'

services:
  jaspr:
      container_name: jaspr
      build:
        context: .
        dockerfile: build/docker/dockerfile-jaspr
      depends_on:
        - redis
      environment:
        - FLASK_APP=jaspr
        - FLASK_DEBUG=True
        - FLASK_ENV=development
        - REDIS_HOST=redis
      image: cdcflu/jaspr:v1
      links:
        - redis
      tty: true
      volumes:
        - ${CODESHARE}:/app
      ports:
        - 5000:5000
  
  nginx:
      image: webapp-nginx
      build:
        context: build/docker/nginx
        dockerfile: dockerfile-nginx
      shm_size: 512m
      environment:
        - SSL_CERTIFICATE=${SSL_CERTIFICATE}
        - DEPLOYMENT_DNS="${DEPLOYMENT_DNS:-localhost}"
      ports:
        - "${JASPR_HTTPS_PORT:-80}:80"
        - "${JASPR_HTTPS_PORT:-443}:443"
      volumes:
        - "${CREDENTIALS_PATH:-./run/nginx/credentials}:/credentials"
        - "${LETSENCRYPT_CONFIG_PATH:-./run/nginx/letsencrypt/config}:/etc/letsencrypt"
        - "${LETSENCRYPT_DATA_PATH:-./run/nginx/letsencrypt/data}:/data/letsencrypt"
      healthcheck:
        test: ["CMD", "curl", "-sf", "--header", "Host: healthcheck.local", "localhost:80", "-o", "/dev/null"]
        interval: 180s
        timeout: 10s
        retries: 3      
      depends_on:
        - jaspr

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
