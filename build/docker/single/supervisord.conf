[supervisord]
nodaemon=true

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uwsgi]
command=/bin/bash -lc ". /opt/conda/etc/profile.d/conda.sh && conda activate jaspr_env && pip install -e . && uwsgi --ini app.ini -H /opt/conda/envs/jaspr_env"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/bin/bash -lc "/root/setup.sh && nginx -g 'daemon off;'"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
