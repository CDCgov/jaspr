# app.conf
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 5000M;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    location / {
         resolver 127.0.0.1;
         try_files $uri @app;
          }
    location @app {
        include uwsgi_params;
        uwsgi_pass jaspr:5000;
    }
}
