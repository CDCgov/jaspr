version: '3.3'

services:
  jaspr:
      build:
        context: .
        dockerfile: dockerfile-jaspr
      depends_on:
        - redis
      environment:
        - FLASK_APP=jaspr
        - FLASK_DEBUG=True
        - FLASK_ENV=development
        - REDIS_HOST=redis
      image: cdcflu/jaspr:v1
      links:
        - redis
      tty: true
      volumes:
        - ${CODESHARE}:/app
      ports:
        - 5000:5000
  
  nginx:
      image: webapp-nginx
      build:
        context: .
        dockerfile: dockerfile-nginx
      ports:
        - 80:80
      depends_on:
        - jaspr

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
